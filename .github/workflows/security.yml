name: Source security checks

on:
  push:
  pull_request:
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch the exact public event commit and complete ancestry anonymously
        shell: bash
        run: |
          python3 - <<'PY'
          # BEGIN SECURITY CHECKOUT
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          repository = os.environ.get("GITHUB_REPOSITORY", "")
          revision = os.environ.get("GITHUB_SHA", "")
          if repository != "payals/hobnail" or not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise SystemExit("explicit public repository and exact event SHA required")
          source = Path("source")
          templates = Path("empty-git-templates")
          source.mkdir(mode=0o700)
          templates.mkdir(mode=0o700)
          environment = {
              "PATH": "/usr/bin:/bin", "LANG": "C.UTF-8", "LC_ALL": "C.UTF-8",
              "GIT_CONFIG_NOSYSTEM": "1", "GIT_CONFIG_GLOBAL": "/dev/null",
              "GIT_TERMINAL_PROMPT": "0", "GIT_NO_REPLACE_OBJECTS": "1",
              "GIT_ATTR_NOSYSTEM": "1", "GIT_NO_LAZY_FETCH": "1", "GIT_ALLOW_PROTOCOL": "https",
          }
          git = ["/usr/bin/git", "--no-replace-objects", "-c", "core.hooksPath=/dev/null",
                 "-c", "core.fsmonitor=false", "-c", "credential.helper=",
                 "-c", "core.askPass=/bin/false", "-c", "protocol.allow=never",
                 "-c", "protocol.https.allow=always", "-c", "http.followRedirects=false",
                 "-c", "fetch.fsckObjects=true", "-c", "transfer.fsckObjects=true",
                 "-c", "submodule.recurse=false", "-c", "fetch.recurseSubmodules=false"]
          def run(*arguments):
              return subprocess.run([*git, *arguments], cwd=source, env=environment,
                                    stdin=subprocess.DEVNULL, check=True, text=True,
                                    capture_output=True, timeout=120).stdout.strip()
          run("init", "--quiet", "--template=" + str(templates.resolve()))
          # Deliberately no --depth: the scanner refuses shallow histories.
          run("fetch", "--no-tags", "https://github.com/" + repository + ".git", revision)
          run("checkout", "--quiet", "--detach", "FETCH_HEAD")
          if run("rev-parse", "HEAD") != revision or run("rev-parse", "--is-shallow-repository") != "false":
              raise SystemExit("exact complete public ancestry was not fetched")
          marker_path = source / "PUBLIC-SOURCE.json"
          if not marker_path.is_file() or marker_path.is_symlink() or marker_path.stat().st_size > 1_048_576:
              raise SystemExit("public source marker required; private development history is not a CI input")
          marker = json.loads(marker_path.read_text())
          if (not isinstance(marker, dict) or marker.get("schema") != "hobnail-public-source-v1"
                  or marker.get("profile") != "public" or marker.get("repository") != repository):
              raise SystemExit("public source identity differs from intended repository")
          print(json.dumps({"repository": repository, "commit": revision,
                            "anonymous_public_checkout": True, "complete_selected_ancestry": True}))
          # END SECURITY CHECKOUT
          PY
      - name: Scan current files and reachable public history with exact reviewed exceptions
        working-directory: source
        shell: bash
        run: |
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 python3 -m venv --without-pip .venv
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 .venv/bin/python scripts/release_safety.py \
            --repository "$PWD" --revision "$GITHUB_SHA" --history \
            --allowlist security/scan-allowlist.json --attribution-policy github-noreply \
            --receipt ../security-scan.json
      - name: Recheck the pinned optional MCP dependency closure
        working-directory: source
        shell: bash
        run: |
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 .venv/bin/python scripts/check_mcp_dependencies.py \
            --profile linux-x86_64-py312 --receipt ../mcp-dependency-check.json
      - name: Report optional public dependency-review evidence without fallback
        shell: bash
        env:
          DEPENDENCY_REVIEW_MODE: ${{ vars.HOBNAIL_DEPENDENCY_REVIEW }}
        run: |
          python3 - <<'PY'
          # BEGIN OPTIONAL DEPENDENCY REVIEW
          import http.client
          import json
          import os
          from pathlib import Path
          import re
          import urllib.error
          import urllib.request

          def finish(status, code=0, **fields):
              print(json.dumps({"check": "dependency_review", "status": status, **fields}, sort_keys=True))
              raise SystemExit(code)

          mode = os.environ.get("DEPENDENCY_REVIEW_MODE", "")
          if mode in {"", "disabled"}:
              finish("not_configured", meaning="No dependency vulnerability, age or provenance conclusion")
          if mode != "enabled":
              finish("configuration_error", 1)
          if os.environ.get("GITHUB_EVENT_NAME") != "pull_request":
              finish("not_applicable_to_event", meaning="No pull-request dependency comparison exists")
          if os.environ.get("GITHUB_REPOSITORY") != "payals/hobnail":
              finish("repository_identity_error", 1)
          try:
              event_file = Path(os.environ["GITHUB_EVENT_PATH"])
              if event_file.stat().st_size > 4_194_304:
                  raise ValueError("event too large")
              event = json.loads(event_file.read_text())
              request = event["pull_request"]
              base, head = request["base"]["sha"], request["head"]["sha"]
              if (request["base"]["repo"]["full_name"] != "payals/hobnail"
                      or not all(isinstance(value, str) and re.fullmatch(r"[0-9a-f]{40}", value) for value in (base, head))):
                  raise ValueError("invalid exact public revisions")
          except (OSError, KeyError, TypeError, ValueError):
              finish("event_evidence_invalid", 1)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          url = "https://api.github.com/repos/payals/hobnail/dependency-graph/compare/" + base + "..." + head
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
          http_request = urllib.request.Request(url, headers={
              "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "hobnail-public-dependency-review",
          })
          try:
              with opener.open(http_request, timeout=20) as response:
                  if response.status != 200:
                      finish("unavailable", 1, http_status=response.status)
                  # GitHub documents Link for paginated results. This bounded
                  # single-response client refuses pagination rather than
                  # declaring a clean first page or following supplied URLs.
                  if any(response.headers.get(header) for header in (
                          "Link", "Content-Range", "X-GitHub-Truncated")):
                      finish("incomplete_api_evidence", 1)
                  raw = response.read(2_097_153)
                  length = response.headers.get("Content-Length")
                  if length is not None and int(length) != len(raw):
                      raise ValueError("response length differs")
              if len(raw) > 2_097_152:
                  raise ValueError("response too large")
              changes = json.loads(raw)
              if not isinstance(changes, list) or len(changes) > 10000:
                  raise ValueError("invalid dependency response")
              added = vulnerable = 0
              for change in changes:
                  if (not isinstance(change, dict) or change.get("change_type") not in {"added", "removed"}
                          or not isinstance(change.get("vulnerabilities"), list)
                          or any(not isinstance(change.get(field), str) or not 0 < len(change[field]) <= 4096
                                 for field in ("manifest", "ecosystem", "name", "version"))):
                      raise ValueError("invalid dependency evidence")
                  if change["change_type"] == "added":
                      added += 1
                      vulnerable += len(change["vulnerabilities"])
          except urllib.error.HTTPError as error:
              status = error.code
              error.close()
              finish("unavailable", 1, http_status=status)
          except (OSError, urllib.error.URLError, TimeoutError, http.client.HTTPException):
              finish("unavailable", 1)
          except (TypeError, ValueError, UnicodeError):
              finish("invalid_api_evidence", 1)
          finish("blocked" if vulnerable else "completed", 1 if vulnerable else 0,
                 base=base, head=head, added_dependencies=added, added_vulnerability_records=vulnerable,
                 meaning="Known advisory comparison only; no artifact-age, provenance, license or operating-system clearance")
          # END OPTIONAL DEPENDENCY REVIEW
          PY
