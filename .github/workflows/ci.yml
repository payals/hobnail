name: Portable source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch the exact public event commit anonymously
        shell: bash
        run: |
          python3 - <<'PY'
          # BEGIN PUBLIC CHECKOUT
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          repository = os.environ.get("GITHUB_REPOSITORY", "")
          revision = os.environ.get("GITHUB_SHA", "")
          if not re.fullmatch(r"[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?/[A-Za-z0-9_.-]{1,100}", repository):
              raise SystemExit("invalid public repository identity")
          if repository.split("/")[1] in {".", "..", ".git"}:
              raise SystemExit("invalid public repository name")
          if not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise SystemExit("exact SHA-1 commit required")
          source = Path("source")
          templates = Path("empty-git-templates")
          source.mkdir(mode=0o700)
          templates.mkdir(mode=0o700)
          environment = {
              "PATH": "/usr/bin:/bin", "LANG": "C.UTF-8", "LC_ALL": "C.UTF-8",
              "GIT_CONFIG_NOSYSTEM": "1", "GIT_CONFIG_GLOBAL": "/dev/null",
              "GIT_TERMINAL_PROMPT": "0", "GIT_NO_REPLACE_OBJECTS": "1",
              "GIT_ATTR_NOSYSTEM": "1", "GIT_NO_LAZY_FETCH": "1", "GIT_ALLOW_PROTOCOL": "https",
          }
          git = ["/usr/bin/git", "-c", "core.hooksPath=/dev/null", "-c", "credential.helper=",
                 "-c", "core.askPass=/bin/false", "-c", "protocol.allow=never",
                 "-c", "protocol.https.allow=always", "-c", "http.followRedirects=false",
                 "-c", "fetch.fsckObjects=true", "-c", "transfer.fsckObjects=true",
                 "-c", "submodule.recurse=false", "-c", "fetch.recurseSubmodules=false"]
          def run(*arguments):
              return subprocess.run([*git, *arguments], cwd=source, env=environment,
                                    stdin=subprocess.DEVNULL, check=True, text=True,
                                    capture_output=True, timeout=120).stdout.strip()
          run("init", "--quiet", "--template=" + str(templates.resolve()))
          run("fetch", "--no-tags", "--depth=1", "https://github.com/" + repository + ".git", revision)
          run("checkout", "--quiet", "--detach", "FETCH_HEAD")
          if run("rev-parse", "HEAD") != revision:
              raise SystemExit("checked-out commit differs from event")
          print(json.dumps({"repository": repository, "commit": revision, "anonymous_public_checkout": True}))
          # END PUBLIC CHECKOUT
          PY
      - name: Create the project environment and check the explicit portable profile
        working-directory: source
        shell: bash
        run: |
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 python3 -m venv --without-pip .venv
          portable_receipt_parent="$(cd .. && pwd -P)"
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 .venv/bin/python scripts/check_portable.py --receipt "$portable_receipt_parent/portable-checks.json"
      - name: Install the local SDK offline and run the documented first example
        working-directory: source
        shell: bash
        run: |
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 .venv/bin/python -m ensurepip
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 .venv/bin/python -m pip --isolated install --no-index --no-deps --no-build-isolation .
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 .venv/bin/hobnail --help
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 .venv/bin/python -I -m hobnail --help
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 .venv/bin/python -I - <<'PY'
          import sys
          from pathlib import Path
          import hobnail
          from hobnail import discover

          assert Path(hobnail.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          suggestions = discover(b'{"total":7}')
          assert suggestions["authoritative"] is False
          assert [item["plugin"] for item in suggestions["suggestions"]] == ["bytes.sha256", "json.required_fields"]
          print("Authoritative:", suggestions["authoritative"])
          print("Suggested checks:", ", ".join(item["plugin"] for item in suggestions["suggestions"]))
          PY
      - name: Compile source syntax without running runtime integrations
        working-directory: source
        shell: bash
        run: |
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 .venv/bin/python -m compileall -q src scripts tests build_backend.py integrations/mcp
      - name: Check and install the exact optional MCP dependencies
        working-directory: source
        shell: bash
        run: |
          set -eu
          mcp_receipt_parent="$(cd .. && pwd -P)"
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 .venv/bin/python scripts/check_mcp_dependencies.py \
            --profile linux-x86_64-py312 --download-dir "$mcp_receipt_parent/mcp-wheels" --receipt "$mcp_receipt_parent/mcp-dependencies.json"
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 .venv/bin/python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          receipt = json.loads(Path('../mcp-dependencies.json').read_text())
          manifest = Path('security/mcp-dependencies.json').read_bytes()
          lock = Path('integrations/mcp/requirements-linux-x86_64-py312.lock').read_bytes()
          assert receipt['status'] == 'passed' and receipt['wheel_bytes_verified'] is True
          assert receipt['profile'] == 'linux-x86_64-py312'
          assert hashlib.sha256(manifest).hexdigest() == receipt['manifest_sha256']
          assert hashlib.sha256(lock).hexdigest() == receipt['lock_sha256']
          PY
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 PIP_CONFIG_FILE=/dev/null .venv/bin/python -m pip --isolated install \
            --no-index --find-links ../mcp-wheels --require-hashes --only-binary=:all: \
            -r integrations/mcp/requirements-linux-x86_64-py312.lock
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 PIP_CONFIG_FILE=/dev/null .venv/bin/python -m pip --isolated install \
            --no-index --no-deps --no-build-isolation ./integrations/mcp
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 .venv/bin/python -m pip --isolated check
      - name: Exercise installed MCP entry points and actual stdio protocol fixtures
        working-directory: source
        shell: bash
        run: |
          set -eu
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 .venv/bin/hobnail-mcp --help
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 .venv/bin/python -I -m hobnail_mcp --help
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 .venv/bin/python -I - <<'PY'
          import sys
          from pathlib import Path
          import hobnail_mcp
          assert Path(hobnail_mcp.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          PY
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 .venv/bin/python -m unittest discover -s tests -p test_mcp_protocol.py -v
