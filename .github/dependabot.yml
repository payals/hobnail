version: 2
updates:
  # Core stays dependency-free; the optional MCP distribution has reviewed pins.
  # Enabling the repository's security-update feature is a separate live step.
  - package-ecosystem: pip
    directories:
      - /
      - /integrations/mcp
    schedule:
      interval: weekly
      day: monday
      time: "06:23"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:43"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
